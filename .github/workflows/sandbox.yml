name: Validate Sunrise runtime sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandbox.yml'
      - 'tools/sandbox/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sandbox.yml'
      - 'tools/sandbox/**'
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'sunrise-mod.toml'

permissions:
  contents: read

concurrency:
  group: sunrise-qol-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Restore Sunrise build tool
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-cli-7fb2aa4d-rust-1.99.1-v1

      - name: Install Sunrise WASM builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/sunrise-org/sunrise --rev 7fb2aa4d cargo-sunrise-mod --locked

      - name: Save Sunrise builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}

      - name: Read pinned SDK revision
        id: sdk
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib
          with Path("Cargo.toml").open("rb") as f:
              print("revision=" + tomllib.load(f)["package"]["metadata"]["sunrise"]["sdk"])
          PY

      - name: Restore pinned SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .sunrise/sdk
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-sdk-${{ steps.sdk.outputs.revision }}-v1

      - name: Prepare pinned SDK
        run: cargo sunrise-mod hooks "__sdk_cache_init__"

      - name: Save pinned SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sunrise/sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sunrise-qol-wasm-v1
          cache-bin: 'false'
          cache-on-failure: 'true'
          workspaces: |
            . -> target

      - name: Build actual QOL WASM package
        run: cargo sunrise-mod build --wasm

      - name: Build matching shared WASM standard
        run: cargo sunrise-mod wasm-std target/sunrise-wasm-std.wasm

      - name: Validate Rust ABI and package imports
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sandbox/check.py \
            target/sunrise-mod/horizon_qol_suite.smod target/sunrise-wasm-std.wasm \
            | tee "${{ runner.temp }}/sunrise-abi.json"

      - name: Restore Sunrise runtime dependency cache
        uses: actions/cache@v4
        with:
          path: target/sunrise-sandbox
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-rust1.99.1-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-

      - name: Gameplay scenarios with actual Sunrise runtime
        timeout-minutes: 30
        shell: bash
        run: bash tools/sandbox/run.sh

      - name: Attach ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-sandbox-abi
          path: ${{ runner.temp }}/sunrise-abi.json
          if-no-files-found: ignore
