name: Validate Sunrise WASM package

on:
  workflow_dispatch:
  # Main builds once in release.yml; PRs get the same validation without publishing.
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/sandbox.yml'
      - '.github/actions/validate/**'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'licenses/**'
      - 'Cargo.toml'
      - 'sunrise-mod.toml'
      - 'tools/sandbox/**'
      - 'tools/sdk_sync.py'
      - 'tools/sdk_cache_prune.py'
      - 'tools/install_sdk_tool.sh'
      - 'tools/wasm_link_check.py'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: sunrise-qol-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out mod source
        uses: actions/checkout@v4

      - name: Check latest Sunrise nightly SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk_sync.py --github-output "$GITHUB_OUTPUT"

      - name: Compile and verify the mod in Sunrise
        uses: ./.github/actions/validate
        with:
          sdk-revision: ${{ steps.sdk.outputs.revision }}

      - name: Upload validated mod for manual game testing
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-validated
          path: target/sunrise-mod/sunrise_qol.smod
          if-no-files-found: error
