name: Validate Sunrise runtime sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sandbox.yml'
      - 'tools/sandbox/**'
      - 'tools/gameplay/**'
      - 'tools/runner/**'
      - 'tools/sdk_sync.py'
      - 'tools/install_sdk_tool.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sandbox.yml'
      - 'tools/sandbox/**'
      - 'tools/gameplay/**'
      - 'tools/runner/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/sdk_sync.py'
      - 'tools/install_sdk_tool.sh'
      - 'Cargo.toml'
      - 'sunrise-mod.toml'

permissions:
  contents: read

concurrency:
  group: sunrise-qol-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    # Private game data are available only to repository-owned branches.
    # External contributions require review and a maintainer-owned branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.SUNRISE_QOL_GAMEPLAY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 110
    steps:
      - name: Verify private game resources are mounted
        if: vars.SUNRISE_QOL_GAMEPLAY_RUNNER != ''
        env:
          SUNRISE_TEST_RESOURCES: ${{ vars.SUNRISE_TEST_RESOURCES }}
        run: |
          for file in facts.json gameplay-facts.json block-behaviours.json; do
            test -s "$SUNRISE_TEST_RESOURCES/$file" && test -r "$SUNRISE_TEST_RESOURCES/$file" || exit 1
          done

      - name: Check out mod source
        uses: actions/checkout@v4

      # Exercise the exact SDK of the published nightly on every PR and push.
      # This modifies the runner's Cargo.toml only; release.yml persists the
      # updated SDK pin after a successful validation on main.
      - name: Resolve and pin latest published Sunrise SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk_sync.py --github-output "$GITHUB_OUTPUT"

      - name: Validate source and sandbox assertions
        run: python3 -m unittest discover -s tests -v

      - name: Export complete source parity coverage
        run: python3 tools/parity/report.py --output target/parity-coverage.json

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Restore Sunrise build tool
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-cli-${{ steps.sdk.outputs.revision }}-signed-prebuilt-v1

      - name: Install signed Sunrise WASM builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        env:
          SDK_REVISION: ${{ steps.sdk.outputs.revision }}
        run: bash tools/install_sdk_tool.sh "$SDK_REVISION"

      - name: Save Sunrise builder
        if: steps.builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}

      - name: Restore pinned SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .sunrise/sdk
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-sdk-${{ steps.sdk.outputs.revision }}-v1

      - name: Prepare pinned SDK
        run: cargo sunrise-mod hooks "__sdk_cache_init__"

      - name: Save pinned SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sunrise/sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sunrise-qol-wasm-v1
          cache-bin: 'false'
          cache-on-failure: 'true'
          workspaces: |
            . -> target

      - name: Test Rust parity helpers on native host
        run: cargo test --lib

      - name: Build actual QOL WASM package
        run: cargo sunrise-mod build --wasm

      - name: Build matching shared WASM standard
        run: cargo sunrise-mod wasm-std target/sunrise-wasm-std.wasm

      - name: Validate Rust ABI and package imports
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sandbox/check.py \
            target/sunrise-mod/horizon_qol_suite.smod target/sunrise-wasm-std.wasm \
            | tee "${{ runner.temp }}/sunrise-abi.json"

      - name: Restore Sunrise runtime dependency cache
        uses: actions/cache@v4
        with:
          path: target/sunrise-sandbox
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-rust1.99.1-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-

      - name: Gameplay scenarios with actual Sunrise runtime
        timeout-minutes: 30
        shell: bash
        run: bash tools/sandbox/run.sh

      - name: Real Sunrise Game state gameplay tests
        env:
          SUNRISE_TEST_RESOURCES: ${{ vars.SUNRISE_TEST_RESOURCES }}
        timeout-minutes: 70
        shell: bash
        run: bash tools/gameplay/run.sh

      - name: Upload built mod for manual game testing (unverified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-unverified-build
          path: target/sunrise-mod/horizon_qol_suite.smod
          if-no-files-found: ignore

      - name: Upload complete parity matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-parity-matrix
          path: target/parity-coverage.json
          if-no-files-found: warn

      - name: Upload real-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-real-gameplay
          path: |
            target/gameplay-evidence.json
            target/gameplay-run.log
          if-no-files-found: warn

      - name: Attach ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-sandbox-abi
          path: ${{ runner.temp }}/sunrise-abi.json
          if-no-files-found: ignore
