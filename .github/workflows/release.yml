name: Build and release Sunrise QOL

on:
  workflow_dispatch:
  # Rebuild only when a published nightly SDK changes.
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/sandbox.yml'
      - '.github/actions/validate/**'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'licenses/**'
      - 'Cargo.toml'
      - 'sunrise-mod.toml'
      - 'instalar.fish'
      - 'preparar-rust.fish'
      - 'diagnosticar.fish'
      - 'tools/wasm_link_check.py'
      - 'tools/sandbox/**'
      - 'tools/parity/**'
      - 'tools/migrate_settings.py'
      - 'tests/**'
      - 'tools/release.py'
      - 'tools/sdk_sync.py'
      - 'tools/sdk_cache_prune.py'
      - 'tools/install_sdk_tool.sh'

permissions:
  contents: write
  actions: write

concurrency:
  group: sunrise-qol-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out sources and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Verify the official nightly commit and its published, signed SDK.
      - name: Check latest Sunrise nightly SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk_sync.py --github-output "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        run: python3 tools/release.py plan --github-output "$GITHUB_OUTPUT"

# Reuse the previous tag if an interrupted run left its release incomplete.
      - name: Plan release publication
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.version.outputs.changed }}
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if [[ "$CHANGED" == "true" ]]; then
            {
              echo "build=true"
              echo "resume=false"
              echo "version=$NEXT_VERSION"
              echo "tag=$NEXT_TAG"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(printf '%s' "$PREVIOUS_TAG" | sed 's/^v//')"
          package="sunrise_qol-$version.smod"
          if gh release view "$PREVIOUS_TAG" --json assets \
             --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt" 2>/dev/null; then
            if grep -Fxq "$package" "$RUNNER_TEMP/release-assets.txt" &&
               grep -Fxq 'SHA256SUMS.txt' "$RUNNER_TEMP/release-assets.txt"; then
              echo "Release $PREVIOUS_TAG is complete."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git merge-base --is-ancestor "$PREVIOUS_TAG" HEAD
          {
            echo "build=true"
            echo "resume=true"
            echo "version=$version"
            echo "tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Resuming incomplete release $PREVIOUS_TAG."

      - name: Update manifests and release notes
        if: steps.publish.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          SDK_REVISION: ${{ steps.sdk.outputs.revision }}
          RESUME: ${{ steps.publish.outputs.resume }}
        run: |
          set -euo pipefail
          if [[ "$RESUME" == "true" ]]; then
            test "$(cat VERSION)" = "$VERSION"
            printf '# Sunrise QOL v%s\n\nRecovered missing release assets.\n' \
              "$VERSION" > release-notes.md
          else
            python3 tools/release.py notes "$VERSION" --output release-notes.md
            python3 tools/release.py stamp "$VERSION"
          fi
          printf '\nSunrise nightly SDK: %s\n' "$SDK_REVISION" >> release-notes.md


      # Shared validation avoids a duplicate pipeline and never starts the full game.
      - name: Compile and verify the mod in Sunrise
        if: steps.publish.outputs.build == 'true'
        uses: ./.github/actions/validate
        with:
          sdk-revision: ${{ steps.sdk.outputs.revision }}

      - name: Package release artifacts
        if: steps.publish.outputs.build == 'true'
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/sunrise-mod/sunrise_qol.smod "dist/sunrise_qol-$VERSION.smod"
          (cd dist && sha256sum *.smod > SHA256SUMS.txt)
      - name: Commit version and tag only after a successful build
        if: steps.publish.outputs.build == 'true'
        id: release-push
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          TAG: ${{ steps.publish.outputs.tag }}
          RESUME: ${{ steps.publish.outputs.resume }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESUME" == "true" ]]; then
            git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null
            git merge-base --is-ancestor "$TAG" HEAD
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never release an outdated checkout if main advanced during the build.
          git fetch --quiet origin main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "New commits landed during this build; the newer queued run will publish instead."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml sunrise-mod.toml VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
          fi
          git tag -a "$TAG" -m "Sunrise QOL $TAG"
          # Push both refs together: never publish a tag without its matching branch.
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"; then
            git fetch --quiet origin main
            if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
              echo "Main advanced while publishing; skipping this obsolete release."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Atomic push failed without a branch update; preserving the failure." >&2
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release and changelog
        if: steps.publish.outputs.build == 'true' && steps.release-push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
          VERSION: ${{ steps.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.smod dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.smod dist/SHA256SUMS.txt \
              --title "Sunrise QOL $TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          grep -Fxq "sunrise_qol-$VERSION.smod" <<< "$assets"
          grep -Fxq 'SHA256SUMS.txt' <<< "$assets"
          echo "Verified published release $TAG"

      # Cache entries are immutable: delete superseded revisions through the Actions API.
      # Only the successfully published main run has cache-delete permission.
      - name: Remove caches from previous Sunrise SDKs
        if: steps.sdk.outputs.updated == 'true' && steps.release-push.outputs.pushed == 'true' && steps.publish.outputs.resume != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_REVISION: ${{ steps.sdk.outputs.revision }}
        run: python3 tools/sdk_cache_prune.py "$SDK_REVISION"

      - name: Retire incorrectly numbered v2.0.0 after v1.0.1 is published
        if: steps.publish.outputs.tag == 'v1.0.1' && steps.release-push.outputs.pushed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never remove the previous release unless the corrected package exists.
          gh release view v1.0.1 --json assets --jq '.assets[].name' |
            grep -Fxq 'Sunrise-QOL-1.0.1.smod'
          old_tag="$(git ls-remote origin refs/tags/v2.0.0 | cut -f1)"
          if [ "$old_tag" != "3f51c263fd5f4743e4a7c4798e28cf7cbae3eeb8" ]; then
            echo "Refusing to delete an unexpected v2.0.0 tag: $old_tag" >&2
            exit 1
          fi
          gh release delete v2.0.0 --yes
          git push origin ':refs/tags/v2.0.0'
