name: Build and release Sunrise QOL

on:
  workflow_dispatch:
  # Rebuild when upstream publishes a new SDK even without a QOL source change.
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/sandbox.yml'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'licenses/**'
      - 'Cargo.toml'
      - 'sunrise-mod.toml'
      - 'instalar.fish'
      - 'preparar-rust.fish'
      - 'diagnosticar.fish'
      - 'tools/wasm_link_check.py'
      - 'tools/sandbox/**'
      - 'tools/gameplay/**'
      - 'tools/parity/**'
      - 'tools/migrate_settings.py'
      - 'tests/**'
      - 'tools/release.py'
      - 'tools/sdk_sync.py'
      - 'tools/install_sdk_tool.sh'

permissions:
  contents: write

concurrency:
  group: sunrise-qol-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.SUNRISE_QOL_GAMEPLAY_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out sources and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # The nightly tag and its signed sdk-<sha> release must both exist.
      # Update only the runner checkout here. Persist the pin in main only
      # after compilation, ABI validation and the real Wasmtime sandbox pass.
      - name: Resolve and pin latest published Sunrise SDK
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sdk_sync.py --github-output "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        shell: bash
        run: python3 tools/release.py plan --github-output "$GITHUB_OUTPUT"

      - name: Install Python and validate source
        run: python3 -m unittest discover -s tests -p 'test*.py' -v

      - name: Export complete source parity coverage
        run: python3 tools/parity/report.py --output target/parity-coverage.json

      - name: Update manifests and release notes
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release.py notes "$VERSION" --output release-notes.md
          printf '\nSunrise nightly SDK: `%s`\n' "${{ steps.sdk.outputs.revision }}" >> release-notes.md
          python3 tools/release.py stamp "$VERSION"
          python3 -m unittest discover -s tests -p 'test*.py' -v

      - name: Install Rust 1.99.1
        if: steps.version.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rust-src, rustfmt
          targets: wasm32-unknown-unknown

      - name: Validate Rust source syntax
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.rs; do
            rustfmt --edition 2024 --emit stdout "$file" > /dev/null
          done

      # Cache the signature-verified prebuilt CLI matching this exact SDK.
      - name: Restore Sunrise build tool
        if: steps.version.outputs.changed == 'true'
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-cli-${{ steps.sdk.outputs.revision }}-signed-prebuilt-v1

      - name: Install signed Sunrise WASM build tool
        if: steps.version.outputs.changed == 'true' && steps.builder-cache.outputs.cache-hit != 'true'
        env:
          SDK_REVISION: ${{ steps.sdk.outputs.revision }}
        run: bash tools/install_sdk_tool.sh "$SDK_REVISION"

      - name: Verify Sunrise build tool
        if: steps.version.outputs.changed == 'true'
        run: test -x "$HOME/.cargo/bin/cargo-sunrise-mod"

      - name: Save Sunrise build tool
        if: steps.version.outputs.changed == 'true' && steps.builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-sunrise-mod
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}

      # The SDK cache is keyed by the resolved official nightly revision.
      - name: Restore pinned Sunrise SDK
        if: steps.version.outputs.changed == 'true'
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .sunrise/sdk
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-sdk-${{ steps.sdk.outputs.revision }}-v1

      - name: Prepare pinned Sunrise SDK
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Unlike 'update', 'hooks' fetches and validates the pinned SDK.
          cargo sunrise-mod hooks "__sdk_cache_init__"
          test -f .sunrise/sdk/api/crates/sunrise-mod-api/Cargo.toml

      - name: Save pinned Sunrise SDK
        if: steps.version.outputs.changed == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sunrise/sdk
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Restore compiled Rust dependencies
        if: steps.version.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: sunrise-qol-wasm-v1
          cache-bin: 'false'
          cache-on-failure: 'true'
          workspaces: |
            . -> target

      - name: Run Rust module parity tests
        if: steps.version.outputs.changed == 'true'
        run: cargo test --lib

      - name: Compile sandboxed mod (not the game)
        if: steps.version.outputs.changed == 'true'
        run: cargo sunrise-mod build --wasm

      - name: Validate mod package
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s target/sunrise-mod/horizon_qol_suite.smod
          unzip -tq target/sunrise-mod/horizon_qol_suite.smod
          unzip -Z1 target/sunrise-mod/horizon_qol_suite.smod | grep -Fxq 'mod.wasm'
          mkdir -p dist
          cp target/sunrise-mod/horizon_qol_suite.smod "dist/Sunrise-QOL-${{ steps.version.outputs.version }}.smod"
          (cd dist && sha256sum *.smod > SHA256SUMS.txt)

      # Validate the exact .smod under the same Sunrise Wasmtime runtime that loads game mods.
      # Pin the upstream source to the SDK commit to avoid silently testing a different API.
      - name: Build matching WASM standard for runtime test
        if: steps.version.outputs.changed == 'true'
        run: cargo sunrise-mod wasm-std target/sunrise-wasm-std.wasm

      - name: Check guest imports against shared WASM standard
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sandbox/check.py \
            target/sunrise-mod/horizon_qol_suite.smod target/sunrise-wasm-std.wasm \
            | tee "${{ runner.temp }}/sunrise-abi.json"

      - name: Restore real Sunrise runtime cache
        if: steps.version.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: target/sunrise-sandbox
          key: ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-rust1.99.1-v1
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sunrise-runtime-${{ steps.sdk.outputs.revision }}-

      - name: Smoke test with actual Sunrise runtime
        if: steps.version.outputs.changed == 'true'
        timeout-minutes: 30
        shell: bash
        run: bash tools/sandbox/run.sh

      - name: Real Sunrise Game gameplay validation
        if: steps.version.outputs.changed == 'true'
        env:
          SUNRISE_TEST_RESOURCES: ${{ vars.SUNRISE_TEST_RESOURCES }}
        timeout-minutes: 70
        shell: bash
        run: bash tools/gameplay/run.sh

      - name: Upload complete parity matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-parity-matrix
          path: target/parity-coverage.json
          if-no-files-found: warn

      - name: Upload real-game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-gameplay
          path: |
            target/gameplay-evidence.json
            target/gameplay-run.log
          if-no-files-found: warn

      - name: Attach sandbox ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-qol-abi
          path: ${{ runner.temp }}/sunrise-abi.json
          if-no-files-found: ignore

      - name: Commit version and tag only after a successful build
        if: steps.version.outputs.changed == 'true'
        id: release-push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Never release an outdated checkout if main advanced during the build.
          git fetch --quiet origin main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo "New commits landed during this build; the newer queued run will publish instead."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml sunrise-mod.toml VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
          fi
          git tag -a "$TAG" -m "Sunrise QOL $TAG"
          # Push both refs together: never publish a tag without its matching branch.
          if ! git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"; then
            git fetch --quiet origin main
            if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
              echo "Main advanced while publishing; skipping this obsolete release."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Atomic push failed without a branch update; preserving the failure." >&2
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release and changelog
        if: steps.version.outputs.changed == 'true' && steps.release-push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.smod dist/SHA256SUMS.txt \
            --title "Sunrise QOL $TAG" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Retire incorrectly numbered v2.0.0 after v1.0.1 is published
        if: steps.version.outputs.tag == 'v1.0.1' && steps.release-push.outputs.pushed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never remove the previous release unless the corrected package exists.
          gh release view v1.0.1 --json assets --jq '.assets[].name' |
            grep -Fxq 'Sunrise-QOL-1.0.1.smod'
          old_tag="$(git ls-remote origin refs/tags/v2.0.0 | cut -f1)"
          if [ "$old_tag" != "3f51c263fd5f4743e4a7c4798e28cf7cbae3eeb8" ]; then
            echo "Refusing to delete an unexpected v2.0.0 tag: $old_tag" >&2
            exit 1
          fi
          gh release delete v2.0.0 --yes
          git push origin ':refs/tags/v2.0.0'
